[project]
name = "rlvr"
version = "0.1.0"
description = "Reinforcement Learning with Verifiable Rewards - 学习项目"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Guanghan Ning", email = "guanghan.ning@bytedance.com"}
]

[tool.ruff]
# 目标 Python 版本
target-version = "py310"

# 行长度限制（放宽以适应现有代码）
line-length = 120

# 排除目录
exclude = [
    ".git",
    ".venv",
    "__pycache__",
    "_deprecated",
    "outputs",
    "logs",
]

[tool.ruff.lint]
# 启用的规则
select = [
    "E",      # pycodestyle errors
    "F",      # pyflakes
    "I",      # isort (import sorting)
    "UP",     # pyupgrade (Python 版本升级建议)
    "B",      # flake8-bugbear (常见 bug)
    "SIM",    # flake8-simplify (简化建议)
]

# 忽略的规则
ignore = [
    "E501",   # 行过长 - 允许超过限制（中文注释常较长）
    "E402",   # 模块级导入不在顶部 - 允许（sys.path 操作需要）
    "F401",   # 导入但未使用 - 警告但不报错（__init__.py 中常见）
    "B008",   # 函数默认参数使用可变对象 - 允许
    "SIM108", # 三元表达式建议 - 不强制
]

# 允许自动修复
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.isort]
# import 分组顺序
known-first-party = ["src"]
section-order = ["future", "standard-library", "third-party", "first-party", "local-folder"]

[tool.ruff.format]
# 引号风格
quote-style = "double"
# 缩进风格
indent-style = "space"
# 行尾
line-ending = "auto"
